name: ci

# nicotina's tests, on every push to main and every pull request:
#
#   unit         tests/run.sh: the client against a stub TX.WTF instance (tests/stub_txwtf.py).
#                The launcher, ari check, ari snapshot in both terminal backends, arigl snapshot
#                (text, and a PNG under Xvfb), and bin/nicotina typed at in tmux.
#   integration  tests/local.sh: the client against a real txwtf server it starts on a fresh
#                SQLite database. txwtf-cp312 is installed from cvcpkg.org, where txwtf publishes
#                it to the private atxcf organization (txwtf's repository is private too). That
#                needs the repository secret CVCPKG_ATXCF_READ_TOKEN, a cvcpkg.org token with read
#                access to atxcf. Only the install step sees it, never the tests. A pull request
#                from a fork gets no secrets and skips this job.
#
# Both run the ari and arigl packages from cvcpkg.org (ci/install-hosts.sh), as a person installs
# them: nicotina targets the stock, packaged hosts, never a libcvc build.
#
# GitHub-hosted runners only: this repository is public, and a pull request's workflows must
# never reach the self-hosted runners on catx-03.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The txwtf server the integration tests run: the newest published (txwtf publishes on v* tags;
  # tx.wtf runs 0.4.0). Pin one with ==VERSION.
  TXWTF_COMPONENT: atxcf/txwtf-cp312

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Are there tests?
        id: tests
        run: |
          if [ -f tests/run.sh ] && [ -f share/nicotina/main.ari ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no tests/run.sh or share/nicotina/main.ari in this commit; nothing to test."
            echo "tests=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cvcpkg
      - name: Install ari and arigl (cvcpkg)
        run: bash ci/install-hosts.sh ~/nicotina-ci
      - name: tmux, Xvfb and Mesa
        run: bash ci/test-env.sh ~/nicotina-ci
      - name: tests/run.sh
        env:
          NICOTINA_TEST_OUT: ${{ runner.temp }}/out
        run: ARI=~/nicotina-ci/deps/bin/ari ARIGL=~/nicotina-ci/deps/bin/arigl bash tests/run.sh
      # The tests search every output for the session tokens and fail if one is there, so what
      # is uploaded holds none.
      - name: Keep the outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-outputs
          path: ${{ runner.temp }}/out
          retention-days: 7

  integration:
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: The txwtf token
        id: token
        env:
          HAVE: ${{ secrets.CVCPKG_ATXCF_READ_TOKEN != '' }}
          FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          if [ "$HAVE" = true ]; then echo "have=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "have=false" >> "$GITHUB_OUTPUT"
          if [ "$FORK" = true ]; then
            echo "::notice::a pull request from a fork gets no secrets, so the integration tests (which need CVCPKG_ATXCF_READ_TOKEN) are skipped."
          else
            echo "::error::set the repository secret CVCPKG_ATXCF_READ_TOKEN, a cvcpkg.org token with read access to the atxcf organization, where txwtf-cp312 is published."
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.have == 'true'
      - uses: ./.github/actions/setup-cvcpkg
        if: steps.token.outputs.have == 'true'
      - name: Install ari and arigl (cvcpkg)
        if: steps.token.outputs.have == 'true'
        run: bash ci/install-hosts.sh ~/nicotina-ci
      - name: tmux, Xvfb and Mesa
        if: steps.token.outputs.have == 'true'
        run: bash ci/test-env.sh ~/nicotina-ci
      - name: Install txwtf from cvcpkg.org
        if: steps.token.outputs.have == 'true'
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_ATXCF_READ_TOKEN }}
        run: |
          cvcpkg install "$TXWTF_COMPONENT" --prefix ~/nicotina-txwtf --config release --link shared
          # The bundle's console scripts start with `#!/usr/bin/env python3.12`, and the runner has
          # Python 3.12s of its own (setup-python's, the system's) without txwtf. So the prefix's
          # bin/ goes first on PATH, for this step and the tests, as txwtf's systemd unit does.
          echo "$HOME/nicotina-txwtf/bin" >> "$GITHUB_PATH"
          PATH=$HOME/nicotina-txwtf/bin:$PATH txwtf version
      - name: tests/local.sh
        if: steps.token.outputs.have == 'true'
        env:
          NICOTINA_TEST_OUT: ${{ runner.temp }}/out
        run: |
          TXWTF_PREFIX=~/nicotina-txwtf ARI=~/nicotina-ci/deps/bin/ari ARIGL=~/nicotina-ci/deps/bin/arigl \
            bash tests/local.sh
      - name: Keep the outputs
        if: failure() && steps.token.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: integration-outputs
          path: ${{ runner.temp }}/out
          retention-days: 7
