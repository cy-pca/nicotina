name: deploy-cyberpcangel

# Publishes nicotina's browser pages, public and not login-gated:
#   https://cyberpcangel.com/nicotina/       the ImGui client (libcvc arigl-web's index.html)
#   https://cyberpcangel.com/nicotina-term/  the terminal client (arigl-web's ari.html)
# deploy/cyberpcangel/README.md has the whole chain and the one-time setup.
#
# The pages are the single-threaded arigl-web package from cvcpkg.org, as a site installs it: the
# stock, packaged host, never a libcvc build.
#
# It runs on catx-03 (label cvcpkg-prod: the cy-pca org runner, catx-03-cy-pca, one job at a time),
# which holds the cyberpcangel deploy key. The key's forced command on
# catx-00 maps the fixed action `deploy-nicotina` to /root/nicotina-deploy.sh in the cyberpcangel
# instance; the client never names a path. No pull_request trigger: a pull request must not reach
# the runner that holds the key.
#
# It deploys what CI has tested: after the `ci` workflow succeeds on a push to this repository's
# main, it publishes that commit's documents. Only a push qualifies, and only from this repository
# (a fork's pull request can run CI on a branch that is also called main). It still stops when
# nothing has moved since the live build (.built-from). It can also be run by hand, with a ref.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'The nicotina branch, tag or commit whose documents to publish'
        type: string
        default: 'main'
      force:
        description: 'Publish even if nothing moved since the live build'
        type: boolean
        default: false

concurrency:
  group: deploy-cyberpcangel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, cvcpkg-prod]
    timeout-minutes: 30
    env:
      # Where arigl-web goes. cvcpkg also lays down the static wasm libraries the package was
      # linked from (the bundle lists them as its deps), which the pages don't use; this prefix
      # already has them, from when this workflow built the pages itself.
      WEB_PREFIX: /home/github-runner/cvc-wasm/deps-wasm
      DEPLOY_KEY: /home/github-runner/.ssh/id_ed25519_cyberpcangel_deploy
      # After CI: exactly the commit CI tested. By hand: the ref given.
      DOCS_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || 'main' }}
    steps:
      - name: Checkout the deploy scripts
        uses: actions/checkout@v4
        with:
          # After CI, the commit CI tested (a workflow_run's default ref is main's head, which may
          # have moved on); by hand, the workflow's own commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: nicotina

      - name: Checkout the documents (${{ env.DOCS_REF }})
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DOCS_REF }}
          path: docs-src

      # The newest arigl-web; one already in the prefix is a no-op. Before the check, which
      # fingerprints the bundle it resolved to.
      - name: Install arigl-web (cvcpkg)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "cvcpkg: $(command -v cvcpkg) $(cvcpkg --version)"
          mkdir -p "$WEB_PREFIX"
          cvcpkg install arigl-web --platform wasm --arch wasm32 --prefix "$WEB_PREFIX" \
            --config release --link static --no-fallback-to-source 2>&1 | tail -3

      - name: Has anything moved?
        id: check
        run: |
          if [ ! -f docs-src/share/nicotina/main.ari ]; then
            echo "::notice::$DOCS_REF has no share/nicotina/main.ari yet; nothing to publish."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # What a payload depends on: the arigl-web bundle (its version and hash, from the
          # install's lockfile), the documents, and the deploy scripts and page config.
          web=$(awk '/^- name: / {n = $3}
                     n == "arigl-web" && $1 == "version:" {v = $2}
                     n == "arigl-web" && $1 == "sha256:" {h = substr($2, 1, 16)}
                     END {if (v && h) print v "@" h}' "$WEB_PREFIX/share/libcvc-deps/lockfile.yaml")
          [ -n "$web" ] || { echo "::error::no arigl-web in $WEB_PREFIX's lockfile"; exit 1; }
          # The deploy side counts only the files that shape the payload: the page config, the
          # staging script and this workflow. Not the README, verify.py, or nicotina-deploy.sh
          # (installed in the instance by hand, not in the payload).
          shaping=$(git -C nicotina ls-tree HEAD -- deploy/cyberpcangel/ariadne.config.json \
                      deploy/cyberpcangel/stage.sh .github/workflows/deploy-cyberpcangel.yml \
                      | sha256sum | cut -c1-16)
          inputs="arigl-web=$web docs=$(git -C docs-src rev-parse HEAD:share/nicotina) deploy=$shaping"
          fp=$(printf '%s' "$inputs" | sha256sum | cut -c1-16)
          echo "built_from=$fp $inputs nicotina=$(git -C docs-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          live=$(python3 -I -c 'import urllib.request as u
          try: print(u.urlopen("https://cyberpcangel.com/nicotina/.built-from", timeout=30).read().decode().split()[0])
          except Exception: print("none")')
          echo "this build $fp, live $live ($inputs)"
          if [ "$fp" = "$live" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::notice::nothing moved since the live build ($fp)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage
        if: steps.check.outputs.run == 'true'
        run: |
          rm -rf payload
          bash nicotina/deploy/cyberpcangel/stage.sh "$WEB_PREFIX/share/arigl-web" docs-src/share/nicotina \
            payload "${{ steps.check.outputs.built_from }}"

      - name: Publish to cyberpcangel.com
        if: steps.check.outputs.run == 'true'
        run: |
          tar czf - -C payload nicotina nicotina-term \
            | ssh -i "$DEPLOY_KEY" -o BatchMode=yes -o ConnectTimeout=20 tfx@catx-00.tx.wtf deploy-nicotina

      - name: Verify live
        if: steps.check.outputs.run == 'true'
        run: python3 -I nicotina/deploy/cyberpcangel/verify.py payload
