name: Set up cvcpkg
description: >
  The cvcpkg CLI from cy-pca/cvcpkg master on Python 3.12, the way libcvc's CI installs it
  (.github/actions/cvcpkg-build-tools there).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: |
        python -m pip install --quiet 'cvcpkg @ git+https://github.com/cy-pca/cvcpkg@master'
        echo "cvcpkg: $(command -v cvcpkg) $(cvcpkg --version)"
